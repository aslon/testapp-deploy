# Modèle d'équipe du homelab (aslon/homelab-tenant-template). Personnalisé par ./init.sh <équipe> [app].
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: testapp-testapp
labels:
  - pairs:
      team: testapp             # label team obligatoire, égal à votre nom d'équipe
resources:
  - ../base
images:
  - name: testapp                   # le nom écrit dans base/app.yaml
    newName: ghcr.io/aslon/testapp
    newTag: 0.1.0                 # tag précis, jamais latest
    digest: sha256:65d3bbcb969d14cd4072ec7e65fcf87bd368701c42d43d612cf858241d54f7c5
patches:
  - target:
      kind: Ingress
      name: testapp
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: testapp-dev.alson-lab.fr
