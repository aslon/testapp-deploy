# Modèle d'équipe du homelab (aslon/homelab-tenant-template). Personnalisé par ./init.sh <équipe> [app].
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monequipe-hello
labels:
  - pairs:
      team: monequipe             # label team obligatoire, égal à votre nom d'équipe
resources:
  - ../base
images:
  - name: hello                   # le nom écrit dans base/app.yaml
    newName: ghcr.io/nginx/nginx-unprivileged
    newTag: 1.31.8-alpine         # tag précis, jamais latest
    digest: sha256:16de44aff58d6a3906f4eb1499d930378b7f0fa96fdebc7d10962d2b2a4e794b
patches:
  - target:
      kind: Ingress
      name: hello
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: hello-dev.alson-lab.fr
