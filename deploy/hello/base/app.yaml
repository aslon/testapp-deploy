# Modèle d'équipe du homelab (aslon/homelab-tenant-template). Personnalisé par ./init.sh <équipe> [app].
apiVersion: v1
kind: ConfigMap
metadata:
  name: hello-page
data:
  index.html: |
    <!doctype html>
    <html lang="fr"><meta charset="utf-8"><title>Hello</title>
    <h1>Bonjour depuis le homelab</h1>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
  labels:
    app: hello                    # label app obligatoire
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello
  template:
    metadata:
      labels:
        app: hello
    spec:
      runtimeClassName: gvisor    # obligatoire : vos conteneurs tournent sous gVisor
      automountServiceAccountToken: false # l'app n'appelle pas l'API Kubernetes
      securityContext:
        runAsNonRoot: true        # jamais root
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          # nom seul : la version (tag et digest) est fixée par dev/ et prod/ (images:)
          image: hello
          ports:
            - containerPort: 8080 # port non privilégié (> 1024)
          resources:              # limites cpu, mémoire et disque obligatoires
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
              ephemeral-storage: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /
              port: 8080
          volumeMounts:
            - name: page
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: page
          configMap:
            name: hello-page
---
apiVersion: v1
kind: Service
metadata:
  name: hello
spec:
  selector:
    app: hello
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hello
spec:
  ingressClassName: traefik       # obligatoire
  rules:
    - host: HOTE                  # remplacé par dev/ et prod/
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hello
                port:
                  number: 80
